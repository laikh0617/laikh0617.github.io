<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國小 300 單字評量系統</title>
<style>
  :root{
    --bg:#f3f6fb; --card:#ffffff; --ink:#1f2a44; --muted:#6b7790;
    --brand:#3b6ef5; --brand-d:#2952c8; --ok:#1faa6c; --bad:#e0455e;
    --warn:#f0a020; --line:#e3e8f1; --soft:#eef3ff;
    --shadow:0 6px 20px -8px rgba(31,42,68,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:linear-gradient(120deg,var(--brand),#5b86f7);color:#fff;padding:18px 16px;
    box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
  header .wrap{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:1.3rem;margin:0;font-weight:800;letter-spacing:.5px}
  header .badge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;font-size:.8rem}
  nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  nav button{background:rgba(255,255,255,.16);color:#fff;border:0;padding:8px 14px;border-radius:10px;
    font-size:.92rem;cursor:pointer;transition:.15s;font-weight:600}
  nav button:hover{background:rgba(255,255,255,.32)}
  nav button.active{background:#fff;color:var(--brand-d)}
  main{max-width:1000px;margin:22px auto;padding:0 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
    box-shadow:var(--shadow);margin-bottom:18px}
  h2{margin:.2em 0 .6em;font-size:1.25rem}
  .muted{color:var(--muted)}
  .hidden{display:none}

  /* home */
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:8px}
  .mode{border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;background:var(--card)}
  .mode:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--shadow)}
  .mode .ico{font-size:2rem}
  .mode h3{margin:.4em 0 .2em;font-size:1.05rem}
  .mode p{margin:0;font-size:.86rem;color:var(--muted)}

  /* group chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;
    cursor:pointer;font-size:.88rem;transition:.12s}
  .chip:hover{border-color:var(--brand)}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* word table */
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
  th{background:var(--soft);color:var(--brand-d);font-weight:700}
  td.en{font-weight:700;font-size:1.05rem}
  td.no{color:var(--muted);width:54px}
  td.icon{font-size:1.7rem;text-align:center;width:56px;line-height:1}
  .pos{color:var(--warn);font-size:.82rem;font-weight:600}
  .spk{border:0;background:var(--soft);color:var(--brand-d);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:.9rem}
  .spk:hover{background:#dde7ff}
  td.ex{max-width:420px}
  .ex-en{font-size:.92rem;color:var(--ink)}
  .ex-zh{font-size:.85rem;color:var(--muted);margin-top:2px}

  /* setup controls */
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:600}
  select,input[type=number],input[type=text]{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff}
  .btn{background:var(--brand);color:#fff;border:0;padding:11px 22px;border-radius:11px;font-size:1rem;
    cursor:pointer;font-weight:700;transition:.15s}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:var(--soft);color:var(--brand-d)}
  .btn.ghost:hover{background:#dde7ff}

  /* quiz */
  .qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;min-width:140px;margin:0 12px}
  .progress > i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
  .pill{background:var(--soft);color:var(--brand-d);padding:5px 12px;border-radius:999px;font-weight:700;font-size:.9rem}
  .prompt{text-align:center;padding:26px 10px}
  .prompt .big{font-size:2.4rem;font-weight:800;margin:6px 0}
  .prompt .sub{color:var(--muted)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:13px;padding:15px;font-size:1.1rem;
    cursor:pointer;text-align:center;transition:.12s;font-weight:600}
  .opt:hover:not(.locked){border-color:var(--brand);background:var(--soft)}
  .opt.correct{border-color:var(--ok);background:#e7f8f0;color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:#fdeaed;color:var(--bad)}
  .opt.locked{cursor:default}
  .spellbox{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .spellbox input{font-size:1.3rem;padding:12px 16px;text-align:center;letter-spacing:2px;min-width:240px}
  .feedback{text-align:center;font-weight:700;min-height:28px;margin-top:12px}
  .feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
  .center{text-align:center}

  /* result */
  .score-ring{width:160px;height:160px;margin:6px auto;border-radius:50%;display:grid;place-items:center;
    font-size:2.2rem;font-weight:800;color:#fff}
  .review td.r-ok{color:var(--ok)} .review td.r-no{color:var(--bad);font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px}
  @media(max-width:520px){ .prompt .big{font-size:2rem} header h1{font-size:1.1rem} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📚 國小 300 單字評量系統</h1>
    <span class="badge">30 單元 · 300 字</span>
    <nav>
      <button data-view="home" class="active">首頁</button>
      <button data-view="list">單字表</button>
      <button data-view="setup">開始測驗</button>
    </nav>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="view-home">
    <div class="card">
      <h2>歡迎使用 👋</h2>
      <p class="muted">本系統收錄國小常見 300 個英語單字，分成 30 個主題單元（每單元 10 字）。可先瀏覽單字表，再進行四種題型測驗。點下方任一題型可直接開始。</p>
      <div class="modes" id="homeModes"></div>
    </div>
  </section>

  <!-- LIST -->
  <section id="view-list" class="hidden">
    <div class="card">
      <h2>單字表瀏覽</h2>
      <p class="muted">選擇主題單元，點 🔊 可聽發音。</p>
      <div class="chips" id="listChips"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>圖示</th><th>英文</th><th>中文</th><th>發音</th><th>例句</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- SETUP -->
  <section id="view-setup" class="hidden">
    <div class="card">
      <h2>測驗設定</h2>
      <h3 style="margin:.2em 0 .2em;font-size:1rem;color:var(--brand-d)">學生資料</h3>
      <div class="row">
        <label class="fld">班級
          <input type="text" id="stClass" placeholder="例：三年一班" autocomplete="off">
        </label>
        <label class="fld">座號
          <input type="text" id="stSeat" placeholder="例：15" autocomplete="off" inputmode="numeric">
        </label>
        <label class="fld">姓名
          <input type="text" id="stName" placeholder="例：王小明" autocomplete="off">
        </label>
      </div>
      <h3 style="margin:.6em 0 .2em;font-size:1rem;color:var(--brand-d)">測驗範圍</h3>
      <div class="row">
        <label class="fld">題型
          <select id="setMode">
            <option value="e2c">看英選中</option>
            <option value="c2e">看中選英</option>
            <option value="listen">聽音選字</option>
            <option value="spell">拼字填空</option>
          </select>
        </label>
        <label class="fld">出題範圍
          <select id="setScope"></select>
        </label>
        <label class="fld">題數
          <select id="setCount">
            <option>10</option><option>15</option><option selected>20</option><option>30</option>
          </select>
        </label>
      </div>
      <button class="btn" id="startBtn">開始測驗 ▶</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" class="hidden">
    <div class="card">
      <div class="qbar">
        <span class="pill" id="qIndex">第 1 / 20 題</span>
        <div class="progress"><i id="qProg"></i></div>
        <span class="pill" id="qScore">得分 0</span>
      </div>
      <div class="prompt" id="qPrompt"></div>
      <div class="opts" id="qOpts"></div>
      <div class="feedback" id="qFeed"></div>
      <div class="center" style="margin-top:14px">
        <button class="btn ghost hidden" id="nextBtn">下一題 →</button>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="view-result" class="hidden">
    <div class="card center">
      <h2>測驗結果</h2>
      <div class="score-ring" id="ring">0%</div>
      <p id="resSummary" class="muted"></p>
      <div style="margin:12px 0">
        <button class="btn" id="retryBtn">再測一次</button>
        <button class="btn ghost" id="wrongBtn">只練錯題</button>
      </div>
    </div>
    <div class="card review">
      <h2>作答詳解</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>題目</th><th>你的答案</th><th>正確答案</th></tr></thead>
          <tbody id="reviewBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>國小 300 單字評量系統 · 個人學習用途 · 內建瀏覽器語音發音</footer>

<script src="words.js"></script>
<script src="icons.js"></script>
<script>
const FLAT = window.VOCAB_FLAT, GROUPS = window.VOCAB_GROUPS;
const ICONS = window.VOCAB_ICONS || [];
FLAT.forEach((w,i)=>{ w.icon = ICONS[i] || "📘"; });
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const MODE_LABEL = {e2c:"看英選中",c2e:"看中選英",listen:"聽音選字",spell:"拼字填空"};
const MODE_ICON  = {e2c:"🔤",c2e:"🀄",listen:"🔊",spell:"✏️"};
const MODE_DESC  = {e2c:"看英文選正確中文",c2e:"看中文選正確英文",listen:"聽發音選正確單字",spell:"看中文提示拼出英文"};
const EN_POS = (function(){const m={};FLAT.forEach(w=>{if(!m[w.en])m[w.en]=w.pos;});return m;})();
const posOf = en => EN_POS[en] || "";

/* ---------- speech ---------- */
let _enVoice=null, _lastSpoken="";
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/en[-_]US/i.test(v.lang)||/^en/i.test(v.lang));
  const prefer=["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Alex"];
  for(const name of prefer){ const m=vs.find(v=>v.name.includes(name)); if(m){_enVoice=m;return;} }
  _enVoice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if(!_enVoice) pickVoice();
  const slow = (text===_lastSpoken);   // 重複點同一字 → 放慢到 80%
  _lastSpoken = text;
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; if(_enVoice) u.voice=_enVoice;
  u.rate = slow ? 0.8 : 1.0;           // 提高清晰度
  u.pitch = 1.0; u.volume = 1.0;
  // 稍作延遲再播，避免某些瀏覽器吃掉字首
  setTimeout(()=>speechSynthesis.speak(u), 60);
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = pickVoice; }

/* ---------- view switching ---------- */
function show(view){
  ["home","list","setup","quiz","result"].forEach(v=>$("#view-"+v).classList.toggle("hidden",v!==view));
  $$("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  window.scrollTo(0,0);
}
$$("nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));

/* ---------- home tiles ---------- */
(function buildHome(){
  const wrap=$("#homeModes");
  Object.keys(MODE_LABEL).forEach(m=>{
    const d=document.createElement("div");
    d.className="mode";
    d.innerHTML=`<div class="ico">${MODE_ICON[m]}</div><h3>${MODE_LABEL[m]}</h3><p>${MODE_DESC[m]}</p>`;
    d.onclick=()=>{ $("#setMode").value=m; show("setup"); };
    wrap.appendChild(d);
  });
})();

/* ---------- word list ---------- */
let listGroup = 1;
(function buildListChips(){
  const c=$("#listChips");
  const all=document.createElement("div");
  all.className="chip active"; all.textContent="全部 300";
  all.onclick=()=>{listGroup="all";renderChips();renderList();};
  c.appendChild(all);
  GROUPS.forEach(g=>{
    const el=document.createElement("div");
    el.className="chip"; el.dataset.g=g.id;
    el.textContent=`${g.id}. ${g.title}`;
    el.onclick=()=>{listGroup=g.id;renderChips();renderList();};
    c.appendChild(el);
  });
})();
function renderChips(){
  $$("#listChips .chip").forEach(ch=>{
    const isAll = ch.textContent.startsWith("全部");
    ch.classList.toggle("active",(listGroup==="all"&&isAll)||(+ch.dataset.g===listGroup));
  });
}
function renderList(){
  const rows = listGroup==="all"?FLAT:FLAT.filter(w=>w.groupId===listGroup);
  $("#listBody").innerHTML = rows.map(w=>`
    <tr>
      <td class="no">${w.no}</td>
      <td class="icon">${w.icon}</td>
      <td class="en"><span class="pos">${w.pos}</span> ${w.en}</td>
      <td>${w.zh}</td>
      <td><button class="spk" data-say="${w.en.replace(/"/g,'')}">🔊</button></td>
      <td class="ex">
        <div class="ex-en"><button class="spk" data-say="${w.ex.replace(/"/g,'')}">🔊</button> ${w.ex}</div>
        <div class="ex-zh">${w.exZh}</div>
      </td>
    </tr>`).join("");
  $$("#listBody .spk").forEach(b=>b.onclick=()=>speak(b.dataset.say));
}
renderList();

/* ---------- setup scope ---------- */
(function buildScope(){
  const s=$("#setScope");
  s.innerHTML = `<option value="all">全部 300 字</option>` +
    GROUPS.map(g=>`<option value="${g.id}">單元 ${g.id}：${g.title}</option>`).join("");
})();

/* ---------- quiz engine ---------- */
let quiz = null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQuiz(mode,scope,count,pool){
  const source = pool || (scope==="all"?FLAT:FLAT.filter(w=>w.groupId===+scope));
  const picked = shuffle(source).slice(0,Math.min(count,source.length));
  const questions = picked.map(w=>{
    const distractPool = FLAT.filter(x=>x.no!==w.no);
    if(mode==="spell"){
      return {word:w, type:mode, answer:w.en};
    }
    // option-based
    let optKey = (mode==="c2e")?"en":"zh";        // what options show
    let correct = w[optKey];
    const distract = shuffle(distractPool).filter(x=>x[optKey]!==correct).slice(0,3).map(x=>x[optKey]);
    const options = shuffle([correct,...distract]);
    return {word:w,type:mode,options,answer:correct};
  });
  return {mode,scope,count:questions.length,questions,idx:0,score:0,log:[]};
}

function renderQuestion(){
  const q=quiz.questions[quiz.idx];
  $("#qIndex").textContent=`第 ${quiz.idx+1} / ${quiz.questions.length} 題`;
  $("#qScore").textContent=`得分 ${quiz.score}`;
  $("#qProg").style.width=(quiz.idx/quiz.questions.length*100)+"%";
  $("#qFeed").textContent=""; $("#qFeed").className="feedback";
  $("#nextBtn").classList.add("hidden");
  const P=$("#qPrompt"), O=$("#qOpts");
  O.innerHTML="";
  O.removeAttribute("data-locked");   // 重置鎖定，確保每題都可作答

  if(quiz.mode==="e2c"){
    P.innerHTML=`<div class="sub">這個英文單字的中文意思是？</div><div class="big"><span class="pos" style="font-size:1.1rem">${q.word.pos}</span> ${q.word.en}</div>
      <button class="spk" onclick="speak('${q.word.en.replace(/'/g,"")}')">🔊 發音</button>`;
    renderOptions(q);
  }else if(quiz.mode==="c2e"){
    P.innerHTML=`<div class="sub">這個中文的正確英文是？</div><div class="big">${q.word.zh}</div><div class="pos">(${q.word.pos})</div>`;
    renderOptions(q);
  }else if(quiz.mode==="listen"){
    P.innerHTML=`<div class="sub">請聽發音，選出正確單字</div>
      <button class="btn" onclick="speak('${q.word.en.replace(/'/g,"")}')">🔊 播放發音</button>`;
    renderOptions(q);
    setTimeout(()=>speak(q.word.en),350);
  }else if(quiz.mode==="spell"){
    P.innerHTML=`<div class="sub">請依中文提示拼出英文單字</div><div class="big">${q.word.zh}</div>
      <div class="pos">(${q.word.pos})·共 ${q.word.en.replace(/[^a-zA-Z]/g,"").length} 個字母</div>
      <div class="spellbox"><input id="spellIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文後按 Enter"></div>`;
    O.innerHTML=`<div class="center" style="grid-column:1/-1"><button class="btn" id="spellSubmit">送出答案</button></div>`;
    const inp=$("#spellIn");
    inp.focus();
    const submit=()=>checkSpell(q,inp.value);
    $("#spellSubmit").onclick=submit;
    inp.onkeydown=e=>{if(e.key==="Enter")submit();};
  }
}

function renderOptions(q){
  const O=$("#qOpts");
  const enOpts = (quiz.mode==="c2e"||quiz.mode==="listen");
  q.options.forEach(opt=>{
    const b=document.createElement("div");
    b.className="opt";
    if(enOpts){ b.innerHTML=`<span class="pos">${posOf(opt)}</span> ${opt}`; }
    else { b.textContent=opt; }
    b.onclick=()=>chooseOption(q,opt,b);
    O.appendChild(b);
  });
}

function chooseOption(q,opt,el){
  if(el.parentNode.dataset.locked) return;
  el.parentNode.dataset.locked="1";
  $$("#qOpts .opt").forEach(o=>o.classList.add("locked"));
  const correct = opt===q.answer;
  if(correct){ el.classList.add("correct"); quiz.score++; feedback(true); }
  else{ el.classList.add("wrong");
    $$("#qOpts .opt").forEach(o=>{if(o.textContent===q.answer)o.classList.add("correct");});
    feedback(false,q.answer);
  }
  logAnswer(q,opt,correct);
}

function checkSpell(q,val){
  const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
  const correct = norm(val)===norm(q.answer);
  $("#spellIn").disabled=true; $("#spellSubmit")&&($("#spellSubmit").disabled=true);
  if(correct){ quiz.score++; feedback(true); }
  else feedback(false,q.answer);
  logAnswer(q,val||"(空白)",correct);
}

function feedback(ok,ans){
  const f=$("#qFeed");
  f.textContent = ok?"✓ 答對了！":("✗ 答錯了，正確答案：" + ans);
  f.className="feedback "+(ok?"ok":"no");
  $("#qScore").textContent=`得分 ${quiz.score}`;
  $("#nextBtn").classList.remove("hidden");
  $("#nextBtn").focus();
}

function logAnswer(q,given,ok){
  quiz.log.push({
    no:q.word.no,
    question: quiz.mode==="c2e"||quiz.mode==="spell" ? q.word.zh : q.word.en,
    given, answer:q.answer, en:q.word.en, ok
  });
}

$("#nextBtn").onclick=()=>{
  quiz.idx++;
  if(quiz.idx>=quiz.questions.length) finishQuiz();
  else renderQuestion();
};

function finishQuiz(){
  show("result");
  const total=quiz.questions.length, score=Math.round(quiz.score/total*100);
  const ring=$("#ring");
  const color = score>=80?"#1faa6c":score>=60?"#f0a020":"#e0455e";
  ring.style.background=`conic-gradient(${color} ${score*3.6}deg,#e3e8f1 0)`;
  ring.innerHTML=`<div style="background:#fff;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex-direction:column;color:${color};line-height:1.1">
      <span style="font-size:2.6rem;font-weight:800">${score}</span><span style="font-size:.9rem">分</span></div>`;
  const msg = score>=80?"太棒了，繼續保持！🎉":score>=60?"不錯喔，再加油！💪":"多多練習會更好！📖";
  const s=quiz.student||{};
  const who = s.name?`${s.cls}　座號 ${s.seat}　${s.name}　·　`:"";
  $("#resSummary").innerHTML=`${who}題型：${MODE_LABEL[quiz.mode]}　答對 ${quiz.score} / ${total} 題（每題 ${(100/total).toFixed(1)} 分）　${msg}<br><b style="color:${color};font-size:1.15rem">總分：${score} / 100 分</b>`;
  $("#reviewBody").innerHTML=quiz.log.map(l=>`
    <tr>
      <td class="no">${l.no}</td>
      <td>${l.question}</td>
      <td class="${l.ok?'r-ok':'r-no'}">${l.given}${l.ok?' ✓':''}</td>
      <td>${l.answer}${l.answer!==l.en?` <span class="muted">(${l.en})</span>`:''}</td>
    </tr>`).join("");
}

$("#startBtn").onclick=()=>{
  const stu={cls:$("#stClass").value.trim(),seat:$("#stSeat").value.trim(),name:$("#stName").value.trim()};
  if(!stu.cls||!stu.seat||!stu.name){alert("請先輸入班級、座號與姓名");return;}
  const mode=$("#setMode").value, scope=$("#setScope").value, count=+$("#setCount").value;
  quiz=buildQuiz(mode,scope,count);
  quiz.student=stu;
  if(!quiz.questions.length){alert("此範圍沒有單字");return;}
  show("quiz"); renderQuestion();
};
$("#retryBtn").onclick=()=>{ const st=quiz.student; quiz=buildQuiz(quiz.mode,quiz.scope,quiz.count); quiz.student=st; show("quiz"); renderQuestion(); };
$("#wrongBtn").onclick=()=>{
  const wrongNos=new Set(quiz.log.filter(l=>!l.ok).map(l=>l.no));
  const pool=FLAT.filter(w=>wrongNos.has(w.no));
  if(!pool.length){alert("沒有錯題，全部答對了！🎉");return;}
  const st=quiz.student; quiz=buildQuiz(quiz.mode,quiz.scope,pool.length,pool); quiz.student=st; show("quiz"); renderQuestion();
};

// warm up voices
if('speechSynthesis' in window){ speechSynthesis.getVoices(); }
</script>
</body>
</html>
